<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#f1f5f9"/>
  <!-- Microwave Chassis -->
  <rect x="120" y="100" width="400" height="280" rx="16" fill="#334155" stroke="#1e293b" stroke-width="4"/>
  <!-- Glass Window -->
  <rect x="150" y="130" width="240" height="220" rx="8" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Control Panel -->
  <rect x="410" y="130" width="90" height="220" rx="6" fill="#1e293b"/>
  <!-- Digital Display -->
  <rect x="425" y="150" width="60" height="30" rx="4" fill="#020617"/>
  <text x="455" y="172" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">12:00</text>
  <!-- Buttons -->
  <circle cx="440" cy="210" r="10" fill="#475569"/>
  <circle cx="470" cy="210" r="10" fill="#475569"/>
  <circle cx="440" cy="240" r="10" fill="#475569"/>
  <circle cx="470" cy="240" r="10" fill="#475569"/>
  <!-- Surface Scratch -->
  <path d="M 210,180 Q 240,210 270,195 Q 310,230 330,220" stroke="#cbd5e1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="320" y="440" font-family="system-ui, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Sample Appliance #C-3310 (Surface Scratch On Door)</text>
</svg>
